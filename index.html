<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07060c">
<meta name="description" content="The Sorting Ceremony — tap your Richer NFC keychain to discover your house, wand, patronus and today's prophecy.">
<title>The Sorting Ceremony · Richer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="preload" href="sound/hogwartBGSound.mp3" as="audio">
<script defer src="/_vercel/insights/script.js"></script>
<style>
  :root{
    --gold:#D4AF37; --gold-l:#F3DC8A; --gold-d:#8A6D1E;
    --accent:#D4AF37; --accent-l:#F3DC8A; --accent2:#F3DC8A; --accent-rgb:212,175,55;
    --ink:#07060c; --ink2:#0f0d18; --ink3:#171424;
    --parch:#F2E6CC; --muted:rgba(242,230,204,.62);
    --line:rgba(var(--accent-rgb),.28);
    --en:'Cinzel',serif; --serif:'Cormorant Garamond','Prompt',serif; --th:'Prompt',sans-serif;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  body[data-house="valor"]  {--accent:#C0262D;--accent-l:#E8C15A;--accent2:#E8C15A;--accent-rgb:192,38,45}
  body[data-house="ambit"]  {--accent:#1F8A4C;--accent-l:#C9D1D6;--accent2:#C9D1D6;--accent-rgb:31,138,76}
  body[data-house="wisdom"] {--accent:#2F5BD3;--accent-l:#C8935A;--accent2:#C8935A;--accent-rgb:47,91,211}
  body[data-house="loyal"]  {--accent:#E0A526;--accent-l:#F4D27A;--accent2:#2a2218;--accent-rgb:224,165,38}

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--ink)}
  body{
    font-family:var(--serif); color:var(--parch); min-height:100vh; min-height:100dvh; overflow-x:hidden;
    background:radial-gradient(120% 80% at 50% -10%, #1d1830 0%, var(--ink2) 45%, var(--ink) 100%) fixed;
    transition:background .8s;
  }
  body.lang-th{font-family:var(--th)}
  #dust{position:fixed;inset:0;z-index:0;pointer-events:none}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.7) 100%)}

  /* floating controls */
  .fab{position:fixed;top:calc(14px + var(--safe-t));z-index:50;height:42px;min-width:42px;padding:0 12px;border-radius:21px;
    display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
    background:rgba(10,9,16,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);color:var(--accent-l);font:600 12px/1 var(--en);letter-spacing:1.5px;transition:.3s}
  .fab:active{transform:scale(.92)}
  #lang-btn{left:14px}
  #sound-btn{right:14px;width:42px;padding:0}
  #sound-btn .wave{display:flex;gap:2px;align-items:flex-end;height:16px}
  #sound-btn .wave i{width:3px;background:var(--accent-l);border-radius:2px;height:4px}
  #sound-btn.on{box-shadow:0 0 18px rgba(var(--accent-rgb),.55);border-color:rgba(var(--accent-rgb),.7)}
  #sound-btn.on .wave i{animation:eq 1s ease-in-out infinite}
  #sound-btn.on .wave i:nth-child(2){animation-delay:.2s}#sound-btn.on .wave i:nth-child(3){animation-delay:.4s}#sound-btn.on .wave i:nth-child(4){animation-delay:.1s}
  #sound-btn .mute{display:none}
  #sound-btn:not(.on) .wave{display:none}#sound-btn:not(.on) .mute{display:block}
  @keyframes eq{0%,100%{height:4px}50%{height:16px}}

  #app{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:calc(72px + var(--safe-t)) 18px calc(28px + var(--safe-b));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .screen{display:flex;flex-direction:column;align-items:center;width:100%;animation:enter .6s cubic-bezier(.2,.8,.2,1) both;flex:1}
  .screen.leave{animation:leave .35s ease forwards}
  @keyframes enter{from{opacity:0;transform:translateY(18px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
  @keyframes leave{to{opacity:0;transform:translateY(-12px);filter:blur(4px)}}

  .eyebrow{font:600 11px/1.4 var(--en);letter-spacing:4px;color:var(--accent-l);opacity:.75;text-transform:uppercase;text-align:center}
  .lang-th .eyebrow{font-family:var(--th);letter-spacing:2px}
  h1.title{font:700 clamp(30px,9vw,42px)/1.1 var(--en);text-align:center;margin:10px 0 6px;
    background:linear-gradient(180deg,#fff6d6,var(--gold) 55%,var(--gold-d));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 14px rgba(212,175,55,.35))}
  .lang-th h1.title{font-family:var(--th);font-weight:600}
  .sub{font-style:italic;font-size:18px;color:var(--muted);text-align:center;max-width:340px}
  .lang-th .sub{font-style:normal;font-size:15px;font-weight:300}

  .card{position:relative;width:100%;margin-top:22px;padding:26px 20px;border-radius:20px;
    background:linear-gradient(160deg,rgba(28,24,40,.82),rgba(12,10,18,.9));
    border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04)}
  .card::before{content:"";position:absolute;inset:6px;border-radius:15px;border:1px solid rgba(var(--accent-rgb),.12);pointer-events:none}
  .orn{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--accent-l);opacity:.7}
  .orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--accent-l),transparent)}

  .crest{width:112px;height:112px;object-fit:contain;filter:drop-shadow(0 0 22px rgba(212,175,55,.35));animation:float 5s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}

  /* intro */
  .house-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
  .hmini{text-align:center;padding:10px 2px;border-radius:12px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02)}
  .hmini b{display:block;font-size:24px;margin-bottom:4px}
  .hmini span{font:600 8.5px/1.2 var(--en);letter-spacing:1px;color:var(--muted)}
  label.fl{display:block;font:600 11px var(--en);letter-spacing:3px;color:var(--accent-l);margin:6px 0 10px;text-align:center}
  .lang-th label.fl{font-family:var(--th);letter-spacing:1px;font-size:13px}
  .name-in{width:100%;height:56px;border-radius:14px;padding:0 18px;text-align:center;
    background:rgba(0,0,0,.35);border:1px solid var(--line);color:#fff;font:500 20px var(--serif);outline:none;transition:.3s}
  .lang-th .name-in{font-family:var(--th);font-size:17px}
  .name-in::placeholder{color:rgba(242,230,204,.3);font-style:italic}
  .name-in:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.15),0 0 24px rgba(212,175,55,.25)}
  .name-in.shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .btn{position:relative;overflow:hidden;width:100%;min-height:56px;margin-top:16px;border-radius:14px;cursor:pointer;
    font:700 14px/1 var(--en);letter-spacing:2.5px;text-transform:uppercase;color:#1a1204;border:0;
    background:linear-gradient(135deg,#f6e29a,var(--gold) 45%,#a8841f);box-shadow:0 8px 26px rgba(212,175,55,.35);transition:transform .15s,box-shadow .3s}
  .lang-th .btn{font-family:var(--th);letter-spacing:1px;font-size:15px;font-weight:600}
  .btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sheen 3.2s infinite}
  @keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;color:var(--accent-l);border:1px solid var(--line);box-shadow:none}
  .btn.ghost::after{display:none}
  .btn.house{background:linear-gradient(135deg,var(--accent-l),var(--accent));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);box-shadow:0 8px 26px rgba(var(--accent-rgb),.4)}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .btn .spin{display:none;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;margin-right:8px;vertical-align:-3px}
  .btn.loading .spin{display:inline-block}
  .credit{margin-top:18px;text-align:center;font:500 10px var(--en);letter-spacing:2px;color:rgba(212,175,55,.35)}

  /* candles progress */
  .candles{display:flex;justify-content:center;gap:18px;margin:4px 0 2px;height:58px;align-items:flex-end}
  .candle{position:relative;width:10px;height:30px;border-radius:3px 3px 2px 2px;background:linear-gradient(90deg,#cfc3a6,#f4ecd8,#bfb294)}
  .candle::before{content:"";position:absolute;top:-4px;left:4px;width:2px;height:5px;background:#333;border-radius:1px}
  .flame{position:absolute;left:50%;bottom:100%;width:10px;height:18px;margin-left:-5px;margin-bottom:2px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%,#fff 0 18%,#ffd36b 35%,#ff8a1f 70%,transparent 72%);opacity:0;transform:scale(.3);transform-origin:bottom center;transition:.5s}
  .candle.lit .flame{opacity:1;transform:scale(1);animation:flick 1.4s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px #ffb347)}
  .candle.cur .flame{opacity:1;transform:scale(1.2);animation:flick .9s ease-in-out infinite alternate;filter:drop-shadow(0 0 14px #ffd36b)}
  .candle.cur{box-shadow:0 0 22px rgba(255,190,90,.4)}
  @keyframes flick{0%{transform:scale(1) rotate(-3deg)}100%{transform:scale(1.08,.94) rotate(3deg)}}
  .qcount{margin-top:8px}

  .qicon{font-size:40px;text-align:center;display:block;margin-bottom:8px;filter:drop-shadow(0 0 12px rgba(212,175,55,.4))}
  .qtext{font:600 24px/1.3 var(--serif);text-align:center;color:#fff;margin-bottom:20px}
  .lang-th .qtext{font:500 19px/1.5 var(--th)}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;min-height:62px;padding:14px 16px;border-radius:14px;cursor:pointer;
    background:rgba(255,255,255,.025);border:1px solid rgba(212,175,55,.18);color:var(--parch);font:500 17px/1.35 var(--serif);
    transition:transform .15s,border-color .25s,background .25s,box-shadow .25s;animation:enter .5s both}
  .lang-th .opt{font:400 15px/1.5 var(--th)}
  .opt .ltr{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--en);color:var(--gold);border:1px solid rgba(212,175,55,.45);transition:.25s}
  @media (hover:hover){.opt:hover{border-color:rgba(212,175,55,.5);background:rgba(212,175,55,.06)}}
  .opt:active{transform:scale(.98)}
  .opt.sel{border-color:var(--gold);background:linear-gradient(90deg,rgba(212,175,55,.18),rgba(212,175,55,.04));box-shadow:0 0 24px rgba(212,175,55,.22),inset 0 0 0 1px rgba(212,175,55,.3)}
  .opt.sel .ltr{background:var(--gold);color:#1a1204;box-shadow:0 0 14px var(--gold)}

  /* sorting */
  .ritual{position:relative;width:240px;height:240px;margin:40px auto 30px}
  .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(212,175,55,.5)}
  .ring.r1{border-style:dashed;animation:rot 6s linear infinite}
  .ring.r2{inset:22px;border-color:rgba(212,175,55,.35);animation:rot 4s linear infinite reverse}
  .ring.r3{inset:46px;border:2px solid transparent;border-top-color:var(--gold);border-bottom-color:var(--gold-l);animation:rot 1.2s linear infinite}
  .rune{position:absolute;left:50%;top:50%;font:700 16px var(--en);color:var(--gold-l);text-shadow:0 0 10px var(--gold)}
  .orb{position:absolute;inset:78px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff8dc,var(--gold) 40%,rgba(212,175,55,0) 72%);animation:pulse 1.2s ease-in-out infinite;display:grid;place-items:center;font-size:42px}
  @keyframes rot{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{transform:scale(1.12);filter:brightness(1.3)}}
  .ritual-word{font:600 22px var(--en);text-align:center;letter-spacing:3px;min-height:30px;color:var(--gold-l);text-shadow:0 0 18px rgba(212,175,55,.6)}
  .lang-th .ritual-word{font-family:var(--th)}
  .flash{position:fixed;inset:0;z-index:60;background:radial-gradient(circle,#fff 0%,rgba(var(--accent-rgb),.8) 40%,transparent 75%);opacity:0;pointer-events:none}
  .flash.go{animation:flash 1s ease-out}
  @keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

  /* result */
  .banner{position:relative;width:100%;border-radius:22px;overflow:hidden;padding:34px 18px 28px;text-align:center;
    background:linear-gradient(165deg,rgba(var(--accent-rgb),.55),rgba(10,9,16,.92) 70%);border:1px solid rgba(var(--accent-rgb),.6);
    box-shadow:0 0 60px rgba(var(--accent-rgb),.35),0 20px 50px rgba(0,0,0,.5)}
  .banner canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .banner > *:not(canvas){position:relative}
  .hcrest{width:120px;height:138px;margin:4px auto 10px;display:block;filter:drop-shadow(0 0 24px rgba(var(--accent-rgb),.8));animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{transform:scale(.3);opacity:0}}
  .hname{font:900 clamp(32px,10vw,44px)/1 var(--en);letter-spacing:4px;color:#fff;text-shadow:0 0 24px rgba(var(--accent-rgb),.9),0 2px 0 rgba(0,0,0,.4)}
  .lang-th .hname{font-family:var(--th);font-weight:600;letter-spacing:1px}
  .hmotto{margin-top:10px;font-style:italic;font-size:18px;color:var(--accent2)}
  body[data-house="loyal"] .hmotto{color:var(--accent-l)}
  .lang-th .hmotto{font-style:normal;font-size:15px}
  .traits{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:16px}
  .trait{padding:6px 13px;border-radius:20px;font:600 11px var(--en);letter-spacing:1.5px;border:1px solid rgba(var(--accent-rgb),.6);background:rgba(var(--accent-rgb),.18);color:#fff;animation:enter .5s both}
  .lang-th .trait{font-family:var(--th);font-weight:400;letter-spacing:0;font-size:12px}

  .sec-title{font:600 11px var(--en);letter-spacing:4px;color:var(--accent-l);text-align:center;margin-bottom:14px;text-transform:uppercase}
  .lang-th .sec-title{font-family:var(--th);letter-spacing:1px;font-size:13px}

  .scroll{position:relative;margin-top:22px;width:100%;padding:34px 24px 30px;border-radius:6px;color:#2b1d0c;text-align:center;
    background:radial-gradient(ellipse at 30% 20%,#fbf2da,#ecdcb4 60%,#d9c28c);box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 40px rgba(120,80,20,.35)}
  .scroll::before,.scroll::after{content:"";position:absolute;left:-6px;right:-6px;height:14px;border-radius:8px;background:linear-gradient(180deg,#a88246,#5e4319);box-shadow:0 3px 6px rgba(0,0,0,.4)}
  .scroll::before{top:-6px}.scroll::after{bottom:-6px}
  .scroll .s-eye{font:700 10px var(--en);letter-spacing:3px;color:#7a5a22}
  .scroll .s-name{font:700 30px/1.15 var(--en);margin:10px 0 4px;color:#3a2408;word-break:break-word}
  .lang-th .scroll .s-name{font-family:var(--th);font-weight:600;font-size:26px}
  .scroll p{font:italic 17px/1.55 var(--serif);color:#4a3518}
  .lang-th .scroll p{font:400 14px/1.75 var(--th);font-style:normal}
  .scroll .sig{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px}
  .scroll .sig small{font:italic 14px var(--serif);color:#6b5228;text-align:left}
  .seal{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:#fff;
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),var(--accent) 45%,rgba(0,0,0,.5));box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 0 0 3px rgba(0,0,0,.15);transform:rotate(-12deg)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;width:100%}
  .relic{padding:18px 14px;border-radius:16px;background:linear-gradient(160deg,rgba(var(--accent-rgb),.14),rgba(12,10,18,.9));border:1px solid rgba(var(--accent-rgb),.35);text-align:center}
  .relic .ico{font-size:30px;display:block;margin-bottom:6px}
  .relic h4{font:600 10px var(--en);letter-spacing:3px;color:var(--accent-l);margin-bottom:8px}
  .lang-th .relic h4{font-family:var(--th);letter-spacing:1px;font-size:12px}
  .relic .big{font:700 19px/1.2 var(--serif);color:#fff}
  .lang-th .relic .big{font:500 16px/1.35 var(--th)}
  .relic dl{margin-top:8px;font-size:14px;color:var(--muted);line-height:1.45}
  .lang-th .relic dl{font-size:12px}
  .relic dt{display:inline;color:var(--accent-l);opacity:.8}.relic dd{display:inline}
  .relic dd::after{content:"";display:block}

  .prophecy{margin-top:16px;width:100%;padding:22px 20px;border-radius:18px;text-align:center;position:relative;overflow:hidden;
    background:radial-gradient(120% 100% at 50% 0%,rgba(var(--accent-rgb),.22),rgba(12,10,18,.95) 70%);border:1px solid rgba(var(--accent-rgb),.4)}
  .prophecy .date{font:500 12px var(--en);letter-spacing:2px;color:var(--muted)}
  .lang-th .prophecy .date{font-family:var(--th)}
  .spell{font:700 26px var(--en);margin:10px 0 4px;color:var(--gold-l);text-shadow:0 0 18px rgba(212,175,55,.5)}
  .spell-desc{font-style:italic;color:var(--muted);font-size:15px}
  .lang-th .spell-desc{font-style:normal;font-size:13px}
  .prophecy blockquote{margin-top:14px;font:italic 19px/1.5 var(--serif);color:#fff}
  .lang-th .prophecy blockquote{font:400 15px/1.7 var(--th)}
  .lucky{display:flex;justify-content:center;gap:16px;margin-top:14px;font-size:13px;color:var(--muted)}
  .lucky b{color:var(--accent-l);font-weight:600}

  .desc{font-size:17px;line-height:1.65;text-align:center;color:var(--muted)}
  .lang-th .desc{font-size:14px;line-height:1.8}

  .footer{margin-top:28px;text-align:center;padding-bottom:6px}
  .footer a{display:inline-flex;flex-direction:column;gap:4px;color:var(--muted);text-decoration:none;padding:10px 16px;border-radius:12px;border:1px solid transparent;transition:.3s}
  .footer a:active,.footer a:hover{border-color:var(--line);color:var(--gold-l)}
  .footer .brand{font:700 12px var(--en);letter-spacing:5px;color:var(--gold)}
  .footer .tag{font:300 12px var(--th)}

  #toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translate(-50%,30px);z-index:70;opacity:0;pointer-events:none;
    padding:12px 18px;border-radius:30px;background:rgba(12,10,18,.92);border:1px solid var(--line);color:var(--parch);font:500 14px var(--th);transition:.35s;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* streak */
  .streak{margin-top:8px;padding:5px 12px;border-radius:20px;font:500 12px var(--th);color:var(--accent-l);border:1px solid var(--line);background:rgba(var(--accent-rgb),.12)}

  /* patronus summon */
  .relic{position:relative;overflow:hidden}
  .mist{position:absolute;inset:0;display:grid;place-items:center;text-align:center;cursor:pointer;border-radius:16px;
    background:radial-gradient(circle,rgba(200,220,255,.22),rgba(12,10,18,.97) 75%);
    font:600 11px/1.6 var(--en);letter-spacing:2px;color:var(--accent-l);text-transform:uppercase;transition:opacity .9s,transform .9s,filter .9s;animation:breathe 2.4s ease-in-out infinite}
  .lang-th .mist{font-family:var(--th);letter-spacing:0;font-size:13px}
  .relic:not(.veiled) .mist{opacity:0;transform:scale(1.5);filter:blur(10px);pointer-events:none;animation:none}
  .relic.pat:not(.veiled) .pico{animation:pop .9s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 0 16px rgba(200,230,255,.9))}
  @keyframes breathe{50%{box-shadow:inset 0 0 30px rgba(200,220,255,.25)}}

  /* hold-to-cast */
  .cast-btn{position:relative;display:block;width:112px;height:112px;margin:18px auto 10px;border-radius:50%;border:0;cursor:pointer;
    background:radial-gradient(circle,rgba(var(--accent-rgb),.35),transparent 70%);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .cast-btn svg{position:absolute;inset:0;transform:rotate(-90deg)}

  .prophecy:not(.cast) .ph-body{display:none}

  .ph-body{animation:enter .8s both}

  .gend{position:absolute;inset:0;margin:auto;height:fit-content;width:min(340px,88vw);padding:28px 22px;border-radius:20px;text-align:center;
    background:rgba(14,12,22,.95);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.6);animation:enter .5s both}

  .gscore{font:900 68px/1 var(--en);color:var(--gold-l);text-shadow:0 0 24px rgba(212,175,55,.6);margin:10px 0}

  .game.hit-bad{animation:shake .35s,redflash .45s}
  .game.hit-good{animation:goodflash .3s}
  @keyframes redflash{0%{box-shadow:inset 0 0 120px 30px rgba(255,30,70,.65)}100%{box-shadow:inset 0 0 0 0 transparent}}
  @keyframes goodflash{0%{box-shadow:inset 0 0 90px 10px rgba(var(--accent-rgb),.35)}100%{box-shadow:inset 0 0 0 0 transparent}}
  .ghud b.bump{display:inline-block;animation:bump .3s}
  @keyframes bump{40%{transform:scale(1.5);color:#fff}}
  .gscore.done{animation:bump .5s}
  .game .gend .btn{margin-top:0}
  .game .gend #gshare{margin-top:16px}

  .sheet{position:fixed;inset:0;z-index:58;display:grid;place-items:center;padding:20px;background:rgba(3,2,8,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:enter .35s both}
  .sbox{width:min(400px,100%);max-height:86vh;overflow:auto;padding:24px 18px 18px;border-radius:20px;background:linear-gradient(160deg,rgba(28,24,40,.98),rgba(12,10,18,.98));border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .board{list-style:none}
  .board li{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:8px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);animation:enter .5s both}

  .board small{font:400 11px var(--th);color:var(--muted)}
  .board em{font:700 20px var(--en);font-style:normal;color:var(--gold-l)}

  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  const y = new Date(); y.setDate(y.getDate()-1);
  const yk = `${y.getFullYear()}-${y.getMonth()+1}-${y.getDate()}`;

})();

/* ───────────── GOLD DUST BACKGROUND ───────────── */
const dust = (() => {
  const cv=$('#dust'), cx=cv.getContext('2d'); let W,H,DPR,parts=[];
  const N = () => Math.min(90, Math.round(innerWidth*innerHeight/9000));
  function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; cx.setTransform(DPR,0,0,DPR,0,0); parts=Array.from({length:N()},()=>mk(true)); }
  function mk(init){ return { x:Math.random()*W, y:init?Math.random()*H:H+10, r:Math.random()*1.6+.3, vy:-(Math.random()*.35+.08), vx:(Math.random()-.5)*.15, ph:Math.random()*6.28, tw:Math.random()*.03+.01, star:Math.random()<.35 }; }
  let color='212,175,55';
  function frame(){
    cx.clearRect(0,0,W,H);
    for(const p of parts){
      p.x+=p.vx+Math.sin(p.ph)*.12; p.y+=p.vy; p.ph+=p.tw;
      if(p.y<-10){ Object.assign(p,mk(false)); }
      const a=.25+.55*(.5+.5*Math.sin(p.ph*2));
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283);
      cx.fillStyle=p.star?`rgba(255,246,220,${a*.8})`:`rgba(${color},${a})`; cx.fill();
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', resize, {passive:true}); resize(); requestAnimationFrame(frame);
  return { setColor(c){ color=c; } };
})();

/* ───────────── AUDIO ───────────── */
const audio = (() => {
  const el = new Audio(MUSIC_SRC); el.loop=true; el.preload='auto'; el.volume=0;
  const btn=$('#sound-btn'); const TARGET=.55; let fadeId=null;
  let wanted = saved?.sound !== false;  // user preference
  function fade(to, ms, done){
    cancelAnimationFrame(fadeId); const from=el.volume, t0=performance.now();
    const step=now=>{ const k=Math.min(1,(now-t0)/ms); try{ el.volume=from+(to-from)*k; }catch(e){} if(k<1) fadeId=requestAnimationFrame(step); else done&&done(); };
    fadeId=requestAnimationFrame(step);
  }
  function ui(on){ btn.classList.toggle('on',on); btn.setAttribute('aria-pressed',on); }
  function play(){ const p=el.play(); if(p&&p.then) p.then(()=>{ ui(true); fade(TARGET,2200); }).catch(()=>ui(false)); else { ui(true); fade(TARGET,2200); } }
  function pause(){ ui(false); fade(0,500,()=>el.pause()); }
  btn.addEventListener('click', ()=>{ haptic(12); wanted = el.paused || btn.classList.contains('on')===false; if(wanted) play(); else pause(); persist(); });
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ if(!el.paused) el.pause(); } else if(wanted && btn.classList.contains('on')) el.play().catch(()=>{}); });
  return { start(){ if(wanted && el.paused) play(); }, get wanted(){ return wanted; } };
})();

function tally(answers){ const s={valor:0,loyal:0,wisdom:0,ambit:0}; answers.forEach(a=>s[a]++); return s; }
function sortHouse(answers){
  const s=tally(answers); const max=Math.max(...Object.values(s));
  const tied=HOUSES.filter(h=>s[h]===max);
  if(tied.length===1) return tied[0];
  // tie-break: the tied house chosen most recently
  for(let i=answers.length-1;i>=0;i--) if(tied.includes(answers[i])) return answers[i];
  return tied[0];
}
function relics(){
  const L = lang==='th'?1:0, h=state.result;

  const idNo = String(hash(state.name+state.answers.join(''))%900000+100000);

}

/* ───────────── SPARKLE BURST ───────────── */
function burst(x,y,n=24){
  for(let i=0;i<n;i++){
    const s=document.createElement('i'); s.className='spark';
    const a=Math.random()*6.283, d=50+Math.random()*100;
    s.style.left=x+'px'; s.style.top=y+'px';
    s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',Math.sin(a)*d+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),950);
  }
}

/* ───────────── HOLD-TO-CAST PROPHECY ───────────── */
function setupCast(){
  const btn=$('#cast'), prg=$('#prg'), box=$('#proph'); if(!btn) return;
  const LEN=276.5, HOLD=1400; let t0=0, raf=0, lastBuzz=0;
  const reset=()=>{ cancelAnimationFrame(raf); raf=0; btn.classList.remove('charging'); prg.style.strokeDashoffset=LEN; };
  const done=()=>{
    raf=0; btn.classList.remove('charging');
    const b=btn.getBoundingClientRect(); burst(b.left+b.width/2,b.top+b.height/2,40);
    const f=$('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    haptic([40,40,100]); box.classList.add('cast'); persist({castDay:todayKey()});
  };
  const tick=now=>{
    const k=Math.min(1,(now-t0)/HOLD); prg.style.strokeDashoffset=LEN*(1-k);
    if(now-lastBuzz>170){ haptic(6+Math.round(k*24)); lastBuzz=now; }
    if(k<1) raf=requestAnimationFrame(tick); else done();
  };
  btn.addEventListener('pointerdown',e=>{ e.preventDefault(); try{btn.setPointerCapture(e.pointerId);}catch(_){} t0=performance.now(); lastBuzz=0; btn.classList.add('charging'); raf=requestAnimationFrame(tick); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,()=>{ if(raf) reset(); }));
  btn.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); done(); } });
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}

/* ───────────── SOUND EFFECTS (synthesised, no files) ───────────── */
let AC=null;
function sfx(kind){
  if(!audio.wanted) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    const now=AC.currentTime;
    const tone=(f,t,d,type='sine',v=.16,f2)=>{
      const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,now+t);
      if(f2) o.frequency.exponentialRampToValueAtTime(f2,now+t+d);
      g.gain.setValueAtTime(.0001,now+t); g.gain.exponentialRampToValueAtTime(v,now+t+.012); g.gain.exponentialRampToValueAtTime(.0001,now+t+d);
      o.connect(g); g.connect(AC.destination); o.start(now+t); o.stop(now+t+d+.03);
    };
    if(kind==='star'){ tone(880,0,.2); tone(1320,.06,.24,'triangle',.1); }
    else if(kind==='comet'){ [784,988,1175,1568].forEach((f,i)=>tone(f,i*.07,.25,'triangle',.14)); }
    else if(kind==='bad'){ tone(190,0,.38,'sawtooth',.16,60); tone(130,0,.38,'square',.08,45); }
    else if(kind==='end'){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.5,'triangle',.14)); }
    else if(kind==='record'){ [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.1,.6,'triangle',.15)); }
    else if(kind==='tick'){ tone(1400,0,.04,'square',.04); }
  }catch(e){}
}

function openGame(){
  const t=T(); haptic(20);
  const ov=document.createElement('div'); ov.className='game';
  ov.innerHTML=`<canvas></canvas><div class="ghud"><span>${t.points}<b id="gs">0</b></span><span>⏳<b id="gt">20</b></span><button id="gx" aria-label="${t.close}">✕</button></div><div class="gend" hidden></div>`;
  document.body.appendChild(ov); document.body.style.overflow='hidden';
  const cv=ov.querySelector('canvas'), c=cv.getContext('2d'), DPR=Math.min(devicePixelRatio||1,2);
  let W,H; const size=()=>{ W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; c.setTransform(DPR,0,0,DPR,0,0); };
  size(); addEventListener('resize',size);
  const accent=getComputedStyle(document.body).getPropertyValue('--accent-l').trim()||'#F3DC8A';
  const DUR=20000; let items=[], pops=[], score=0, t0=null, last=0, spawnAt=0, raf=0, over=false;
  const gs=ov.querySelector('#gs'), gt=ov.querySelector('#gt');
  function spawn(el){
    const r=Math.random(), type=r<.12?'comet':r<.3?'orb':'star', speed=1+el/DUR*.9;
    items.push({ type, x:30+Math.random()*(W-60), y:-30, r:type==='comet'?16:type==='orb'?18:20,
      vy:(type==='comet'?.38:.15+Math.random()*.12)*speed, rot:Math.random()*6, vr:(Math.random()-.5)*.004 });
  }
  function starPath(x,y,r,rot){ c.beginPath(); for(let i=0;i<10;i++){ const a=rot+i*Math.PI/5-Math.PI/2, rr=i%2?r*.45:r; c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } c.closePath(); }
  function frame(now){
    if(t0===null){ t0=now; last=now; }
    const dt=Math.min(50,now-last); last=now;
    const el=now-t0, left=Math.max(0,DUR-el);
    gt.textContent=Math.ceil(left/1000);
    if(el>=spawnAt && left>0){ spawn(el); spawnAt=el+Math.max(220,520-el/60); }
    c.clearRect(0,0,W,H);
    items=items.filter(o=>o.y<H+40 && !o.dead);
    for(const o of items){
      o.y+=o.vy*dt; o.rot+=o.vr*dt; c.save();
      if(o.type==='orb'){
        const g=c.createRadialGradient(o.x-5,o.y-5,2,o.x,o.y,o.r); g.addColorStop(0,'#b58cff'); g.addColorStop(.5,'#3b145e'); g.addColorStop(1,'#0a0312');
        c.fillStyle=g; c.shadowColor='#ff3b6b'; c.shadowBlur=18; c.beginPath(); c.arc(o.x,o.y,o.r,0,6.283); c.fill();
      } else {
        if(o.type==='comet'){ const tg=c.createLinearGradient(o.x,o.y-90,o.x,o.y); tg.addColorStop(0,'rgba(255,255,255,0)'); tg.addColorStop(1,accent); c.strokeStyle=tg; c.lineWidth=6; c.lineCap='round'; c.beginPath(); c.moveTo(o.x,o.y-90); c.lineTo(o.x,o.y); c.stroke(); }
        c.fillStyle=o.type==='comet'?accent:'#F3DC8A'; c.shadowColor=c.fillStyle; c.shadowBlur=20; starPath(o.x,o.y,o.r,o.rot); c.fill();
      }
      c.restore();
    }
    pops=pops.filter(p=>(p.life-=dt)>0);
    for(const p of pops){ c.save(); c.globalAlpha=p.life/700; c.font='700 24px Cinzel, serif'; c.textAlign='center'; c.fillStyle=p.v>0?'#F3DC8A':'#ff6b8b'; c.fillText((p.v>0?'+':'')+p.v,p.x,p.y-(700-p.life)*.06); c.restore(); }
    if(left<=0){ end(); return; }
    raf=requestAnimationFrame(frame);
  }
  cv.addEventListener('pointerdown',e=>{
    if(over) return;
    for(let i=items.length-1;i>=0;i--){
      const o=items[i];
      if(!o.dead && Math.hypot(o.x-e.clientX,o.y-e.clientY)<o.r+16){
        o.dead=true; const v=o.type==='star'?10:o.type==='comet'?30:-20;
        score=Math.max(0,score+v); gs.textContent=score;
        pops.push({x:o.x,y:o.y,v,life:700}); burst(o.x,o.y,v>0?14:8); haptic(v>0?10:[40,30,40]);
        sfx(v<0?'bad':o.type==='comet'?'comet':'star');
        const cls=v<0?'hit-bad':'hit-good'; ov.classList.remove('hit-bad','hit-good'); void ov.offsetWidth; ov.classList.add(cls);
        gs.classList.remove('bump'); void gs.offsetWidth; gs.classList.add('bump');
        break;
      }
    }
  });
  function end(){
    over=true; c.clearRect(0,0,W,H);
    const prev=(store.get()||{}).best||0, best=Math.max(prev,score), isNew=score>prev;
    const entry={ n:state.name, h:state.result, s:score, d:Date.now() };
    let list=((store.get()||{}).scores||[]).slice();
    if(score>0) list.push(entry);
    list.sort((a,b)=>b.s-a.s||a.d-b.d); list=list.slice(0,30);
    const rank=list.findIndex(e=>e.d===entry.d)+1;
    persist({best,scores:list}); const bv=$('#bestv'); if(bv) bv.textContent=best;
    const box=ov.querySelector('.gend'); box.hidden=false;
    box.innerHTML=`<div class="sec-title">${isNew&&score>0?'🏆 '+t.newBest:t.points}</div><div class="gscore" id="gsc">0</div><div class="desc">${t.best} ${best} <span id="rk">${rank?'· '+t.rank(rank):''}</span></div>
      <button class="btn house" id="gshare">📤 ${t.share2}</button>
      <button class="btn ghost" id="gboard" style="margin-top:10px">${t.boardBtn}</button>
      <button class="btn ghost" id="gagain" style="margin-top:10px">${t.again}</button>
      <button class="btn ghost" id="gclose" style="margin-top:10px">${t.close}</button>`;
    sfx(isNew&&score>0?'record':'end'); haptic([30,50,30]);
    // count-up
    const sc=box.querySelector('#gsc'), t1=performance.now(), D=Math.min(1400,400+score*8);
    (function up(n){ const k=Math.min(1,(n-t1)/D); sc.textContent=Math.round(score*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(up); else { sc.classList.add('done'); } })(t1);
    // confetti
    const fire=(i)=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.2+Math.random()*.35),28);
    if(score>0) for(let i=0;i<(isNew?7:3);i++) setTimeout(()=>fire(i),i*260);
    box.querySelector('#gshare').onclick=()=>shareScore(score);
    box.querySelector('#gboard').onclick=()=>openBoard({n:state.name,s:score});
    if(score>0) submitRemote(entry).then(ok=>ok?remoteRank(score):null).then(r=>{ const k=box.querySelector('#rk'); if(k&&r) k.textContent='· '+t.rank(r); });
    box.querySelector('#gagain').onclick=()=>{ close(); openGame(); };
    box.querySelector('#gclose').onclick=close;
  }
  function close(){ cancelAnimationFrame(raf); removeEventListener('resize',size); ov.remove(); document.body.style.overflow=''; }
  ov.querySelector('#gx').onclick=close;
  raf=requestAnimationFrame(frame);
}

  const conf={ valor:{hue:[10,45],up:1.6,sz:3}, loyal:{hue:[38,52],up:.6,sz:3.5}, wisdom:{hue:[205,235],up:.3,sz:2}, ambit:{hue:[120,150],up:.5,sz:4} }[h];
  const ps=Array.from({length:55},()=>mk(true));
  function mk(init){ return { x:Math.random()*W, y:init?Math.random()*H:H+6, vy:-(Math.random()*conf.up+.2), vx:(Math.random()-.5)*.5, r:Math.random()*conf.sz+.6, life:Math.random()*.6+.4, ph:Math.random()*6.28, hue:conf.hue[0]+Math.random()*(conf.hue[1]-conf.hue[0]) }; }
  (function loop(){
    c.clearRect(0,0,W,H);
    for(const p of ps){ p.ph+=.05; p.x+=p.vx+Math.sin(p.ph)*.3; p.y+=p.vy; p.life-=.004; if(p.life<=0||p.y<-6) Object.assign(p,mk(false),{life:1});
      c.globalAlpha=Math.max(0,p.life)*(.5+.5*Math.sin(p.ph*1.7)); c.fillStyle=`hsl(${p.hue},95%,${h==='wisdom'?85:65}%)`;
      c.shadowColor=c.fillStyle; c.shadowBlur=8; c.beginPath(); c.arc(p.x,p.y,p.r,0,6.283); c.fill(); }
    fxId=requestAnimationFrame(loop);
  })();
}

/* ───────────── ID CARD (1080×1920 canvas) ───────────── */
async function buildCard(){
  try { await document.fonts.ready; await Promise.all(['700 40px Cinzel','500 40px Prompt','italic 40px "Cormorant Garamond"'].map(f=>document.fonts.load(f))); } catch(e){}
  const t=T(), h=state.result, m=HOUSE_META[h], hd=t.houses[h], rl=relics(), d=daily(), th=lang==='th';
  const W=1080, H=1920, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const c=cv.getContext('2d');
  const EN='Cinzel, serif', TH='Prompt, sans-serif', SER='"Cormorant Garamond", Prompt, serif', F = th?TH:EN;
  const GOLD='#D4AF37';
  // background
  let g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,m.bg[0]); g.addColorStop(.45,m.bg[1]); g.addColorStop(1,m.bg[2]); c.fillStyle=g; c.fillRect(0,0,W,H);
  g=c.createRadialGradient(W/2,560,0,W/2,560,800); g.addColorStop(0,hexA(m.c1,.55)); g.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g; c.fillRect(0,0,W,H);
  const r=rng(hash(state.name)); for(let i=0;i<320;i++){ c.globalAlpha=r()*.6+.1; c.fillStyle=r()<.5?'#F3DC8A':'#fff'; c.beginPath(); c.arc(r()*W,r()*H,r()*2.2+.3,0,6.283); c.fill(); } c.globalAlpha=1;
  // frames
  c.strokeStyle=GOLD; c.lineWidth=6; c.globalAlpha=.8; c.strokeRect(48,48,W-96,H-96); c.lineWidth=2; c.globalAlpha=.4; c.strokeRect(68,68,W-136,H-136); c.globalAlpha=1;
  const txt=(s,x,y,font,col,{align='center',blur=0,alpha=1}={})=>{ c.save(); c.font=font; c.fillStyle=col; c.textAlign=align; c.textBaseline='middle'; c.globalAlpha=alpha; if(blur){c.shadowColor=col;c.shadowBlur=blur;} c.fillText(s,x,y); c.restore(); };
  [[96,96],[W-96,96],[96,H-96],[W-96,H-96]].forEach(([x,y])=>txt('✦',x,y,'44px serif',GOLD));
  txt(th?t.school:TEXT.en.school.toUpperCase(), W/2,160, `600 ${th?38:34}px ${F}`, GOLD,{alpha:.9});
  txt(t.idTitle, W/2,215, `500 ${th?30:26}px ${F}`, '#F2E6CC',{alpha:.6});
  line(150,260,W-150);
  // crest
  c.save(); c.translate(W/2,520);
  shield(c,0,0,300); c.fillStyle=(()=>{const gg=c.createLinearGradient(-150,-170,150,170); gg.addColorStop(0,m.c1); gg.addColorStop(1,'#05040a'); return gg;})(); c.fill();
  c.lineWidth=10; c.strokeStyle=GOLD; c.shadowColor=m.c1; c.shadowBlur=60; c.stroke(); c.restore();
  txt(m.emoji, W/2,530, '170px serif','#fff');
  // name + house
  const nm=fit(state.name, 900, th||/[^\x00-\x7F]/.test(state.name)?TH:EN, 110, '700');
  txt(state.name, W/2,820, nm, '#ffffff',{blur:30});
  txt((th?'บ้าน ':'HOUSE ')+hd.name.toUpperCase(), W/2,925, `700 ${th?64:60}px ${F}`, m.c1==='#E0A526'?'#F4D27A':lighten(m.c1), {blur:24});
  txt(`“${hd.motto}”`, W/2,1000, `${th?'400':'italic 500'} ${th?36:42}px ${th?TH:SER}`, '#F2E6CC',{alpha:.8});
  line(150,1070,W-150);
  // relic panels
  panel(110,1110,410,380); panel(560,1110,410,380);
  txt('🪄',315,1180,'70px serif','#fff');
  txt(t.wand.toUpperCase(),315,1260,`600 ${th?32:28}px ${F}`,GOLD);
  txt(rl.wood,315,1320,`600 ${th?38:44}px ${th?TH:SER}`,'#fff');
  txt(rl.core,315,1378,`400 ${th?26:30}px ${th?TH:SER}`,'#F2E6CC',{alpha:.85});
  txt(`${rl.len} · ${rl.flex}`,315,1428,`400 ${th?24:28}px ${th?TH:SER}`,'#F2E6CC',{alpha:.7});
  txt(rl.patEmoji,765,1190,'90px serif','#fff');
  txt(t.patronus.toUpperCase(),765,1290,`600 ${th?32:28}px ${F}`,GOLD);
  txt(rl.patName,765,1360,`600 ${th?42:50}px ${th?TH:SER}`,'#fff');
  txt(t.spirit,765,1420,`400 ${th?24:28}px ${th?TH:SER}`,'#F2E6CC',{alpha:.7});
  // daily spell
  txt('✦ '+t.today+' ✦', W/2,1570,`600 ${th?30:26}px ${F}`,GOLD,{alpha:.85});
  txt(d.spell, W/2,1630,`700 ${th?50:56}px ${th?TH:EN}`,'#F3DC8A',{blur:20});
  // footer
  line(150,1710,W-150);
  txt(`${t.idNo} ${rl.idNo}  ·  ${t.points} ${(store.get()||{}).best||0}  ·  ${new Date().getFullYear()}`, W/2,1765,`500 28px ${EN}`,'#F2E6CC',{alpha:.6});
  txt('✦ RICHER NFC ✦', W/2,1820,`700 30px ${EN}`,GOLD);
  return cv;

  function line(x1,y,x2){ c.save(); const lg=c.createLinearGradient(x1,0,x2,0); lg.addColorStop(0,'rgba(212,175,55,0)'); lg.addColorStop(.5,GOLD); lg.addColorStop(1,'rgba(212,175,55,0)'); c.strokeStyle=lg; c.lineWidth=2; c.beginPath(); c.moveTo(x1,y); c.lineTo(x2,y); c.stroke(); c.restore(); }
  function panel(x,y,w,hh){ c.save(); c.beginPath(); c.roundRect?c.roundRect(x,y,w,hh,28):c.rect(x,y,w,hh); c.fillStyle='rgba(0,0,0,.35)'; c.fill(); c.strokeStyle=hexA(m.c1,.9); c.lineWidth=3; c.stroke(); c.restore(); }
  function fit(s,maxW,fam,start,wt){ let sz=start; do{ c.font=`${wt} ${sz}px ${fam}`; sz-=4; } while(c.measureText(s).width>maxW && sz>40); return c.font; }
}
function shield(c,x,y,w){ const s=w/100; c.beginPath(); c.moveTo(x,y-56*s); c.lineTo(x+42*s,y-42*s); c.lineTo(x+42*s,y); c.bezierCurveTo(x+42*s,y+28*s,x+22*s,y+46*s,x,y+56*s); c.bezierCurveTo(x-22*s,y+46*s,x-42*s,y+28*s,x-42*s,y); c.lineTo(x-42*s,y-42*s); c.closePath(); }
function hexA(hex,a){ const [r,g,b]=hex.match(/\w\w/g).map(x=>parseInt(x,16)); return `rgba(${r},${g},${b},${a})`; }
function lighten(hex){ const [r,g,b]=hex.match(/\w\w/g).map(x=>Math.min(255,parseInt(x,16)+90)); return `rgb(${r},${g},${b})`; }

async function saveCard(){
  const btn=$('#save'); if(btn.classList.contains('loading')) return;
  haptic(20); btn.classList.add('loading');
  try{
    const cv=await buildCard();
    const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
    const fname=`Richer-ID-${state.name.replace(/[^\w฀-๿-]+/g,'_')}.png`;
    const file=new File([blob],fname,{type:'image/png'});
    const mobile = matchMedia('(pointer:coarse)').matches;
    if(mobile && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:T().title}); }catch(e){ if(e.name!=='AbortError') download(blob,fname); }
    } else download(blob,fname);
    haptic([20,40,20]); toast(T().saved);
  }catch(e){ console.error(e); toast('⚠️ '+e.message); }
  finally{ btn.classList.remove('loading'); }
}
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }

async function shareLink(){
  haptic(15); const url=location.origin+location.pathname; const text=T().shareText(state.name, T().houses[state.result].name);
  if(navigator.share){ try{ await navigator.share({title:T().title,text,url}); }catch(e){} return; }
  try{ await navigator.clipboard.writeText(`${text} ${url}`); toast(T().copied); }catch(e){ prompt('Copy link:',url); }
}

/* ───────────── BOOT ───────────── */
applyLang();
render(false);
})();
</script>
